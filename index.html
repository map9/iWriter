<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/iWriter.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iWriter</title>
    <style>
      html[data-theme-bootstrapping="true"] *,
      html[data-theme-bootstrapping="true"] *::before,
      html[data-theme-bootstrapping="true"] *::after {
        transition: none !important;
      }
    </style>
    <script>
      (() => {
        const THEME_KEY = 'iwriter-theme'
        const root = document.documentElement

        try {
          root.setAttribute('data-theme-bootstrapping', 'true')
          const savedTheme = localStorage.getItem(THEME_KEY) || 'system'
          const supportedThemes = ['system', 'light', 'dark', 'cupcake', 'sunset', 'caramellatte', 'abyss', 'dracula']
          const darkThemes = ['dark', 'sunset', 'abyss', 'dracula']
          const selectedTheme = supportedThemes.includes(savedTheme) ? savedTheme : 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolvedTheme = selectedTheme === 'system'
            ? (prefersDark ? 'dark' : 'light')
            : selectedTheme

          root.dataset.theme = selectedTheme === 'system' ? resolvedTheme : selectedTheme
          root.dataset.selectedTheme = selectedTheme
          root.dataset.resolvedTheme = darkThemes.includes(resolvedTheme) ? 'dark' : 'light'
          root.style.colorScheme = darkThemes.includes(resolvedTheme) ? 'dark' : 'light'
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
