name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify tag matches package version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Verify tag commit is contained in main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" refs/remotes/origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not contained in origin/main."
            exit 1
          fi

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: verify-release
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        # postinstall runs electron-rebuild for macOS automatically

      - name: Generate icons
        run: node scripts/generate-icons.mjs && node scripts/prepare-build.mjs

      - name: Build and package
        run: npm run dist:mac -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/latest*.yaml
            release/*.blockmap
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: verify-release
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        # postinstall runs electron-rebuild for Windows x64 automatically

      - name: Install ImageMagick
        run: choco install imagemagick --no-progress

      - name: Generate icons
        run: node scripts/generate-icons.mjs && node scripts/prepare-build.mjs

      - name: Build and package
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: |
            release/*.exe
            release/latest*.yml
            release/latest*.yaml
            release/*.blockmap
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg imagemagick

      - name: Install dependencies
        run: npm ci
        # postinstall runs electron-rebuild for Linux automatically

      - name: Generate icons
        run: node scripts/generate-icons.mjs && node scripts/prepare-build.mjs

      - name: Build and package
        run: npm run dist:linux -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/latest*.yaml
            release/*.zsync
            release/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - build-macos
      - build-windows
      - build-linux
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Generate release notes from changelog
        run: node scripts/extract-release-notes.mjs --version "${GITHUB_REF_NAME#v}" --output release-notes.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.zsync
            release-assets/**/*.yml
            release-assets/**/*.blockmap
          fail_on_unmatched_files: false
